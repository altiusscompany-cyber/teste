<script type="module">
import * as THREE from './package/build/three.module.js';

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, W / H, 0.05, 100);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a2a26, 0.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.5, 5, 2.5); scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb8ff, 1.4); rim.position.set(-4, 2, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe2cc, 0.5); fill.position.set(-3, 0, 4); scene.add(fill);

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

const g = (v, m, s) => Math.exp(-(((v - m) / s) ** 2));

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function cr(pts, y) {
  const n = pts.length;

  if (y >= pts[n - 1][0]) return pts[n - 1][1];
  let i = 0; while (pts[i + 1][0] < y) i++;
  const t = (y - pts[i][0]) / (pts[i + 1][0] - pts[i][0]);
  const v0 = pts[Math.max(0, i - 1)][1], v1 = pts[i][1], v2 = pts[i + 1][1], v3 = pts[Math.min(n - 1, i + 2)][1];
  return 0.5 * (2 * v1 + (-v0 + v2) * t + (2 * v0 - 5 * v1 + 4 * v2 - v3) * t * t + (-v0 + 3 * v1 - 3 * v2 + v3) * t * t * t);
}
function segDist(px, py, ax, ay, bx, by) {

// ---------- torso (lying on the operating table) ----------
const RX = [[-1.52,0],[-1.5,.3],[-1.43,.5],[-1.3,.6],[-1.1,.64],[-.85,.6],[-.55,.52],[-.25,.47],[.05,.48],[.35,.53],[.65,.58],[.95,.62],[1.12,.6],[1.25,.45],[1.33,.22],[1.4,.17],[1.7,.16],[1.76,.1],[1.78,0]];
const RZ = [[-1.52,0],[-1.5,.22],[-1.43,.36],[-1.3,.42],[-1.1,.42],[-.85,.38],[-.55,.34],[-.25,.32],[.05,.33],[.35,.37],[.65,.4],[.95,.36],[1.12,.32],[1.25,.27],[1.33,.19],[1.4,.16],[1.7,.15],[1.76,.1],[1.78,0]];

const zeroOff = () => 0;

const room = new THREE.Group(); scene.add(room);
const torso = new THREE.Group(); room.add(torso);
torso.rotation.x = -Math.PI / 2;           // supine: chest/abdomen facing up, head toward -z
const body = makeSurf(200, 260, -1.52, 1.78);
const skinMat = new THREE.MeshPhysicalMaterial({ color: 0xd9a07f, roughness: 0.55, sheen: 0.4, sheenColor: 0xffc4a8, side: THREE.DoubleSide });
torso.add(new THREE.Mesh(body.geo, skinMat));

// operating table
const padMat = new THREE.MeshStandardMaterial({ color: 0x2c3a48, roughness: 0.7 });
const metal = new THREE.MeshStandardMaterial({ color: 0xb8c2cc, metalness: 0.9, roughness: 0.25 });
const pad = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.14, 4.6), padMat); pad.position.set(0, -0.5, 0.1); room.add(pad);
const rail = new THREE.Mesh(new THREE.BoxGeometry(1.78, 0.05, 4.7), metal); rail.position.set(0, -0.6, 0.1); room.add(rail);
const column = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 1.6, 32), metal); column.position.set(0, -1.42, 0.1); room.add(column);
const foot = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.1, 1.8), metal); foot.position.set(0, -2.25, 0.1); room.add(foot);
// surgical lamp
const lamp = new THREE.Group(); lamp.position.set(0.9, 3.0, -0.4); lamp.rotation.z = 0.35; lamp.rotation.x = 0.15; room.add(lamp);
lamp.add(new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.6, 0.18, 48), new THREE.MeshStandardMaterial({ color: 0xdfe5ea, metalness: 0.3, roughness: 0.4 })));
for (let i = 0; i < 7; i++) {
  const a = i / 6 * Math.PI * 2, r = i === 6 ? 0 : 0.38;
  const bulb = new THREE.Mesh(new THREE.CircleGeometry(0.15, 32), new THREE.MeshBasicMaterial({ color: 0xfffbea }));
  bulb.rotation.x = Math.PI / 2; bulb.position.set(Math.cos(a) * r, -0.095, Math.sin(a) * r); lamp.add(bulb);
}
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 16), metal); arm.position.set(0, 1.15, 0); lamp.add(arm);

// surgical drapes leave only the abdomen exposed
const drapeMat = new THREE.MeshStandardMaterial({ color: 0x2f8a86, roughness: 0.9, side: THREE.DoubleSide });
const drapeTop = makeSurf(200, 80, 0.62, 1.78), drapeBot = makeSurf(200, 40, -1.52, -1.06);
const drapeOff = () => 0.03;
updateSurf(drapeTop, () => 0, drapeOff); updateSurf(drapeBot, () => 0, drapeOff);
torso.add(new THREE.Mesh(drapeTop.geo, drapeMat), new THREE.Mesh(drapeBot.geo, drapeMat));
const sheetHead = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.02, 1.6), drapeMat); sheetHead.position.set(0, -0.41, -1.7); room.add(sheetHead);
const sheetFoot = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.02, 1.4), drapeMat); sheetFoot.position.set(0, -0.41, 1.75); room.add(sheetFoot);
[-0.95, 0.95].forEach(x => { const s = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.6, 4.7), drapeMat); s.position.set(x, -0.7, 0.1); room.add(s); });

const garmentS = makeSurf(200, 120, -1.06, 0.6);
const garmentMat = new THREE.MeshStandardMaterial({ color: 0x24242a, roughness: 0.85, transparent: true, opacity: 0, side: THREE.DoubleSide });
const garment = new THREE.Mesh(garmentS.geo, garmentMat); torso.add(garment);

function surfAt(u, y, off, k = 0) {
  return torsoPoint(Math.asin(clamp(u / cr(RX, y), -1, 1)), y, 1 - k, k, () => off, new THREE.Vector3());
}
const markMat = new THREE.MeshBasicMaterial({ color: 0x7b3fe4, transparent: true });
const markMat2 = new THREE.MeshBasicMaterial({ color: 0x18a36b, transparent: true });
const marks = [];
function addMark(fn, n, closed, mat, t0) {
  const pts = []; for (let i = 0; i <= n; i++) { const [u, y] = fn(i / n); pts.push(surfAt(u, y, 0.006)); }
  const curve = new THREE.CatmullRomCurve3(pts, closed);
  const geo = new THREE.TubeGeometry(curve, 160, 0.0055, 6, closed);
  const m = new THREE.Mesh(geo, mat); torso.add(m); marks.push({ m, t0, total: geo.index.count });
}
let mt = 6.6;
const next = d => (mt += d) - d;
[[0.16, 0.1], [0.27, 0.19], [0.38, 0.27]].forEach(([a, b]) => addMark(f => [a * Math.cos(f * 2 * Math.PI), -0.42 + b * Math.sin(f * 2 * Math.PI)], 80, true, markMat2, next(0.5)));
addMark(f => [0, lerp(0.45, -0.75, f)], 40, false, markMat, next(0.45));
addMark(f => [0.28, lerp(0.4, -0.58, f)], 40, false, markMat, next(0.35));
addMark(f => [-0.28, lerp(0.4, -0.58, f)], 40, false, markMat, next(0.35));
[0.28, 0.02, -0.26].forEach(y => addMark(f => [lerp(-0.27, 0.27, f), y], 30, false, markMat, next(0.3)));
addMark(f => [lerp(0.28, 0.08, f), lerp(-0.58, -1.0, f)], 20, false, markMat, next(0.3));
addMark(f => [lerp(-0.28, -0.08, f), lerp(-0.58, -1.0, f)], 20, false, markMat, next(0.3));

const INC = [[0, -0.265], [0.12, -1.0], [-0.12, -1.0], [0.44, -0.78], [-0.44, -0.78]];
const incisions = INC.map(([u, y], i) => {
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.012, 16, 12), new THREE.MeshBasicMaterial({ color: 0x8a1c1c }));
  dot.position.copy(surfAt(u, y, 0.003)); torso.add(dot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.03, 40), new THREE.MeshBasicMaterial({ color: 0x9fe3ff, transparent: true, side: THREE.DoubleSide }));
  ring.position.copy(surfAt(u, y, 0.01));
  const th = Math.asin(clamp(u / cr(RX, y), -1, 1));
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(Math.sin(th), 0, Math.cos(th)));
  torso.add(ring);
  return { dot, ring, t0: 12.5 + i * 0.35 };
});

// ---------- cannula passing through the abdomen ----------
const STROKES = [ // incision, start, end, fan angle from..to (deg), max reach, strokes
  { inc: INC[1], t0: 41.0, t1: 45.8, a0: 98, a1: 62, reach: 1.15, k: 5 },
  { inc: INC[2], t0: 45.8, t1: 50.6, a0: 82, a1: 118, reach: 1.15, k: 5 },
  { inc: INC[0], t0: 50.6, t1: 55.4, a0: 58, a1: 122, reach: 0.82, k: 5 },
];
function bodyTool(t) {
  for (const S of STROKES) if (t >= S.t0 && t < S.t1) {
    const u = (t - S.t0) / (S.t1 - S.t0);
    let l;
    if (u < 0.1) l = lerp(-0.6, 0.35, ease(u / 0.1));
    else if (u > 0.9) l = lerp(0.35, -0.6, ease((u - 0.9) / 0.1));

const MU = 72, MV = 96, MX0 = -0.75, MX1 = 0.75, MY0 = -1.15, MY1 = 0.8, FPS = 30;
const mapT0 = 41.0, mapT1 = 55.4;

const unitCyl = (r, mat) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 20), mat); bodyCannula.add(m); return m; };

const bShaft = unitCyl(0.011, shaftMat);
const bHandle = unitCyl(0.03, new THREE.MeshStandardMaterial({ color: 0x3c4650, metalness: 0.4, roughness: 0.5 }));

const UP = new THREE.Vector3(0, 1, 0);

// ---------- tissue block (cross-section) ----------
const block = new THREE.Group(); scene.add(block);
const XL = 1.6, ZF = 0.8;

const T0 = 0.9;

const NB = 128;
const binX = b => -XL + 2 * XL * b / (NB - 1);
function toolX(t, t0, t1, k) {
  const u = (t - t0) / (t1 - t0);

const fatT = (x, t) => lerp(T0 * swell(x, t), Tf(x), ease(prog(ASP, t, x)));

function deformBox(w, d, segs, mat) {
  const geo = new THREE.BoxGeometry(w, 1, d, segs, 1, 1);
  const p = geo.attributes.position;
  const top = new Uint8Array(p.count), xs = new Float32Array(p.count);
  for (let i = 0; i < p.count; i++) { top[i] = p.getY(i) > 0 ? 1 : 0; xs[i] = p.getX(i); }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.set = (bot, tp) => {
    for (let i = 0; i < p.count; i++) p.setY(i, top[i] ? tp(xs[i]) : bot(xs[i]));
    p.needsUpdate = true; geo.computeVertexNormals();
  };
  return mesh;
}
function cellTex(base, line, n) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 512, 512); x.strokeStyle = line; x.lineWidth = 2;
  for (let i = 0; i < n; i++) { const cx = rnd() * 512, cy = rnd() * 512, r = 10 + rnd() * 18; x.beginPath(); x.ellipse(cx, cy, r, r * (0.7 + rnd() * 0.5), rnd() * 3, 0, 7); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const muscleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, map: cellTex('#a3343c', '#6e1d24', 520), roughness: 0.6 });
const fatMat = new THREE.MeshStandardMaterial({ color: 0xe8b94a, roughness: 0.65 });
const dermMat = new THREE.MeshPhysicalMaterial({ color: 0xdea183, roughness: 0.5, sheen: 0.4, sheenColor: 0xffc4a8 });
const muscle = deformBox(2 * XL, 2 * ZF, 128, muscleMat), fat = deformBox(2 * XL, 2 * ZF, 128, fatMat), skin = deformBox(2 * XL, 2 * ZF, 128, dermMat);
block.add(muscle, fat, skin);
muscle.userData.set(() => -0.95, muscleTop);

const lob = [];
for (let x = -1.53; x <= 1.53; x += 0.105) for (let h = 0.07; h < T0 - 0.06; h += 0.1) {
  const r = 0.048 + 0.018 * rnd();
  lob.push({ x: x + (rnd() - 0.5) * 0.05, h: h + (rnd() - 0.5) * 0.04, r, tr: Infinity, j: rnd() * 6.28 });
}
for (const L of lob) for (let f = 0; f < ASP.frames.length; f++) {
  const t = ASP.t0 + f / FPS; if (fatT(L.x, t) < L.h + 0.6 * L.r) { L.tr = t; break; }
}
const lobMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 20, 14), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }), lob.length);
block.add(lobMesh);

function tool(r, len, color, rough, metalness = 0.85) {
  const grp = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, metalness, roughness: rough });
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 24), mat); shaft.rotation.z = Math.PI / 2; shaft.position.x = len / 2; grp.add(shaft);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat); grp.add(tip);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(r * 2.6, r * 2.6, 1.2, 24), new THREE.MeshStandardMaterial({ color: 0x3c4650, metalness: 0.4, roughness: 0.5 }));
  handle.rotation.z = Math.PI / 2; handle.position.x = len + 0.6; grp.add(handle);
  block.add(grp); return grp;
}
const infTool = tool(0.016, 1.8, 0xd0d8e0, 0.3);
// diode laser: thin optical fiber with a glowing red tip
const lasTool = tool(0.012, 1.8, 0xf2f4f6, 0.35, 0.1);
const lasCore = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), new THREE.MeshBasicMaterial({ color: 0xff5a4a })); lasTool.add(lasCore);
const lasHalo = new THREE.Mesh(new THREE.SphereGeometry(0.1, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff3020, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false })); lasTool.add(lasHalo);
const lasHalo2 = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff6030, transparent: true, opacity: 0.12, blending: THREE.AdditiveBlending, depthWrite: false })); lasTool.add(lasHalo2);
const lasLight = new THREE.PointLight(0xff4020, 3, 0.9, 1.5); lasLight.position.z = 0.15; lasTool.add(lasLight);
const aspTool = tool(0.034, 1.8, 0xd5dbe2, 0.25);
for (let i = 0; i < 3; i++) { const hole = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 8), new THREE.MeshBasicMaterial({ color: 0x111111 })); hole.position.set(0.07 + i * 0.06, 0.012, 0.03); hole.scale.z = 0.4; aspTool.add(hole); }

const drops = [];
for (let i = 0; i < 200; i++) drops.push({ ts: lerp(INF.t0 + 0.6, INF.t1 - 0.6, i / 200), a: rnd() * 6.28, sp: 0.06 + rnd() * 0.12, r: 0.012 + rnd() * 0.02 });
const dropMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshStandardMaterial({ color: 0x4fb0ff, emissive: 0x1a5aa0, transparent: true, opacity: 0.75, roughness: 0.2 }), drops.length);
block.add(dropMesh);

function toolY(t, P) {
  if (P === ASP) { const mean = fatT(0.5, t); return muscleTop(0.5) + lerp(0.4, 0.62, ss(34.8, 35.8, t)) * mean - 0.02; }
  if (P === LAS) return muscleTop(0.5) + 0.62 * T0;
  return muscleTop(0.5) + 0.5 * T0;
}
const toolPos = (t, P) => new THREE.Vector3(toolX(t, P.t0, P.t1, P.k), toolY(t, P), ZF - 0.01);

// ---------- captions & labels ----------
const CAP = [
  [0.4, 6, '', 'Lipo HD', 'Lipoescultura de alta definição: como o procedimento é feito, em 3D'],
  [6.2, 12.2, 'Etapa 1', 'Marcação', 'O cirurgião desenha os contornos musculares e as áreas de gordura a serem tratadas'],
  [12.3, 16, 'Etapa 2', 'Microincisões', 'Paciente deitado na mesa cirúrgica: cortes de 3 a 5 mm no umbigo, região púbica e flancos'],
  [17.2, 24, 'Etapa 3', 'Infiltração tumescente', 'Soro com anestésico e adrenalina: reduz o sangramento e facilita a retirada da gordura'],
  [24.2, 31, 'Etapa 4', 'Laser de diodo', 'A fibra óptica aquece e derrete a gordura, e a energia térmica estimula a retração da pele'],
  [31.2, 35.2, 'Etapa 5', 'Lipoaspiração profunda', 'Cânulas finas, em movimentos de vaivém, retiram o volume da camada profunda'],
  [35.3, 39.5, 'Etapa 5', 'Escultura superficial', 'Retirada seletiva sobre as linhas musculares (etching), e a pele se acomoda sobre o músculo'],
  [40.8, 48, 'Etapa 5', 'A cânula no corpo', 'Pelas microincisões, a cânula percorre o abdômen em leque, por baixo da pele'],
  [48.2, 55.4, 'Etapa 5', 'A definição aparece', 'Onde a gordura sai, surgem a linha alba, as linhas semilunares e os gomos do abdômen'],
  [55.7, 60, 'Resultado', 'Contorno definido', 'Reto abdominal, linha alba e linhas semilunares evidenciados'],
  [60.2, 64, 'Etapa 6', 'Pós-operatório', 'Cinta compressiva, drenagem linfática e retorno gradual às atividades'],
];
const $ = id => document.getElementById(id);
const labelsEl = $('labels');
const LBL = ['Pele', 'Gordura subcutânea', 'Músculo reto abdominal', 'Linha alba'].map(s => { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = s; labelsEl.appendChild(d); return d; });
function placeLabel(el, v, op) {
  const p = v.clone().project(camera);
  el.style.left = ((p.x + 1) / 2 * W) + 'px'; el.style.top = ((1 - p.y) / 2 * H) + 'px'; el.style.opacity = op;
}

const M4 = new THREE.Matrix4(), Q = new THREE.Quaternion(), S3 = new THREE.Vector3(), P3 = new THREE.Vector3(), C = new THREE.Color();
const cYellow = new THREE.Color(0xf2c552), cMelt = new THREE.Color(0xffa63d), cBlue = new THREE.Color(0xd9d08a), cHot = new THREE.Color(0xff5a3a);
const cDerm = new THREE.Color(0xdea183), cDermHot = new THREE.Color(0xf09080);

function orbit(ang, r, h, look) {
  camera.position.set(look.x + Math.sin(ang) * r, h, look.z + Math.cos(ang) * r); camera.lookAt(look);
}

window.renderAt = function (t) {
  let cap = null; for (const c of CAP) if (t >= c[0] && t <= c[1]) cap = c;
  if (cap) {
    const op = Math.min(ss(cap[0], cap[0] + 0.5, t), 1 - ss(cap[1] - 0.4, cap[1], t));
    $('step').textContent = cap[2]; $('title').textContent = cap[3]; $('sub').textContent = cap[4];
    $('cap').style.opacity = op; $('cap').style.transform = `translateY(${(1 - op) * 12}px)`;
  } else $('cap').style.opacity = 0;
  $('fade').style.opacity = Math.max(1 - ss(0, 0.6, t), ss(16, 16.4, t) * (1 - ss(16.6, 17, t)), ss(39.6, 40, t) * (1 - ss(40.2, 40.6, t)));
  $('card').style.opacity = ss(64, 64.8, t);
  $('wm').style.opacity = 1 - ss(64, 64.8, t);

  const inBlock = t >= 16.4 && t < 40.1;
  room.visible = !inBlock; block.visible = inBlock;
  LBL.forEach(l => l.style.opacity = 0);

  if (!inBlock) {
    const p = mapProg(t);
    const T = t > 40 ? bodyTool(t) : null;
    let bulge = zeroOff;
    bodyCannula.visible = !!T;
    if (T) {
      const [ix, iy] = T.inc, [tx, ty] = T.tip;
      const a = surfAt(ix, iy, -0.01, p(ix, iy));
      const th = Math.asin(clamp(ix / cr(RX, iy), -1, 1)), nrm = new THREE.Vector3(Math.sin(th), 0, Math.cos(th));
      const rx2 = ix + Math.cos(T.a) * 0.3, ry2 = iy + Math.sin(T.a) * 0.3;
      const along = a.clone().sub(surfAt(rx2, ry2, -0.1, p(rx2, ry2))).normalize();
      const dir = along.addScaledVector(nrm, 0.55).normalize();
      const inside = T.l > 0.05;
      const tip = inside ? surfAt(tx, ty, -0.1, p(tx, ty)) : a.clone().addScaledVector(dir, 0.05 - T.l);
      const start = inside ? a : tip;
      const outer = start.clone().addScaledVector(dir, 1.0), hEnd = outer.clone().addScaledVector(dir, 0.45);
      placeCyl(bShaft, start, outer); placeCyl(bHandle, outer, hEnd); placeCyl(bTube, hEnd, hEnd.clone().addScaledVector(dir, 1.2));
      bGhost.visible = inside; if (inside) placeCyl(bGhost, tip, a);
      if (T.l > 0.05) bulge = (x, y, c) => c > 0 ? 0.022 * g(Math.hypot(x - tx, y - ty), 0, 0.05) + 0.008 * g(segDist(x, y, ix, iy, tx, ty), 0, 0.03) : 0;
    }
    updateSurf(body, p, bulge);
    const gop = ss(60.6, 62, t);
    garment.visible = gop > 0; garmentMat.opacity = gop * 0.96;
    if (gop > 0) updateSurf(garmentS, () => 0.4, () => 0.016);
    for (const mk of marks) {
      const pr = ss(mk.t0, mk.t0 + 0.8, t);
      mk.m.visible = pr > 0 && t < 40;
      mk.m.geometry.setDrawRange(0, Math.floor(pr * mk.total / 36) * 36);
    }
    for (const ic of incisions) {
      const on = t >= ic.t0 && t < 56;
      ic.dot.visible = on; ic.ring.visible = on && t < 16.2;
      const ph = ((t - ic.t0) * 1.2) % 1; ic.ring.scale.setScalar(1 + ph * 1.6); ic.ring.material.opacity = 1 - ph;
    }
    const belly = new THREE.Vector3(0, 0.3, 0.25);
    if (t < 6.4) { const u = ease(ss(0, 6.4, t)); orbit(lerp(1.3, 0.75, u), lerp(5.6, 4.6, u), lerp(2.6, 2.3, u), new THREE.Vector3(0.25, -0.2, 0.15)); }
    else if (t < 16.4) { const u = ease(ss(6.0, 8.0, t)); orbit(lerp(0.75, 0.35, u) - 0.06 * ss(8, 16, t), lerp(4.6, 2.2, u), lerp(2.3, 2.15, u), new THREE.Vector3(lerp(0.25, 0.3, u), lerp(-0.2, 0.2, u), lerp(0.15, 0.32, u))); }
    else if (t < 55.6) { const u = ss(40, 55.6, t); orbit(lerp(1.25, 0.9, u), 1.55, 2.55, new THREE.Vector3(-0.05, 0.1, 0.5)); }
    else { const u = ss(55.6, 64.5, t); orbit(lerp(0.6, -0.5, u), 2.6, 2.25, new THREE.Vector3(0.3 - 0.1 * u, 0.15, 0.3)); }
  } else {
    const top = x => muscleTop(x) + fatT(x, t);
    fat.userData.set(muscleTop, top);
    skin.userData.set(top, x => top(x) + 0.07);
    const inf = ss(INF.t0, INF.t1, t);
    fatMat.color.setHex(0xe8b94a).lerp(new THREE.Color(0xd6c27c), 0.5 * inf * (1 - ss(36, 39, t)));

    const lasOn = t > LAS.t0 && t < LAS.t1;
    const lasTip = lasOn ? toolPos(t, LAS) : null;
    dermMat.color.copy(cDerm).lerp(cDermHot, 0.35 * ss(LAS.t0, LAS.t0 + 1, t) * (1 - ss(LAS.t1 - 1, LAS.t1 + 1, t)));
    const aspTip = toolPos(Math.min(Math.max(t, ASP.t0), ASP.t1), ASP);
    for (let i = 0; i < lob.length; i++) {
      const L = lob[i], mt0 = muscleTop(L.x), sw = swell(L.x, t);
      P3.set(L.x, mt0 + L.h * sw + L.r * 0.2, ZF - L.r * 0.35);
      let s = L.r;
      const em = prog(LAS, t, L.x);
      let heat = 0;
      if (lasTip) heat = Math.exp(-((L.x - lasTip.x) ** 2 + (P3.y - lasTip.y) ** 2) / 0.05);
      if (t > L.tr) { const k = clamp((t - L.tr) / 0.45); P3.lerp(aspTip, ease(k)); s *= 1 - k; }
      s *= 1 - 0.22 * em;
      S3.setScalar(Math.max(s, 1e-5)); M4.compose(P3, Q, S3); lobMesh.setMatrixAt(i, M4);
      C.copy(cYellow).lerp(cBlue, 0.35 * prog(INF, t, L.x)).lerp(cMelt, 0.7 * em).lerp(cHot, 0.6 * heat); lobMesh.setColorAt(i, C);
    }
    lobMesh.instanceMatrix.needsUpdate = true; lobMesh.instanceColor.needsUpdate = true;

    for (let i = 0; i < drops.length; i++) {
      const D = drops[i], age = t - D.ts;
      if (age < 0 || age > 2.2) { S3.setScalar(1e-5); M4.compose(P3.set(0, -5, 0), Q, S3); }
      else {
        const p0 = toolPos(D.ts, INF), k = age / 2.2;
        P3.set(p0.x + Math.cos(D.a) * D.sp * Math.sqrt(k) * 2, p0.y + Math.sin(D.a) * D.sp * Math.sqrt(k) * 1.6, ZF - 0.005);
        S3.setScalar(D.r * Math.sin(Math.PI * Math.min(1, k * 1.3)) + 1e-5); M4.compose(P3, Q, S3);
      }
      dropMesh.setMatrixAt(i, M4);
    }
    dropMesh.instanceMatrix.needsUpdate = true;

    infTool.visible = t > INF.t0 && t < INF.t1; if (infTool.visible) infTool.position.copy(toolPos(t, INF));
    lasTool.visible = lasOn; if (lasOn) {
      lasTool.position.copy(lasTip);
      const fl = 0.5 + 0.5 * Math.sin(t * 23);
      lasHalo.material.opacity = 0.25 + 0.15 * fl; lasHalo.scale.setScalar(0.9 + 0.2 * fl);
      lasHalo2.material.opacity = 0.1 + 0.05 * fl; lasLight.intensity = 2.5 + fl;
    }
    aspTool.visible = t > ASP.t0 && t < ASP.t1; if (aspTool.visible) aspTool.position.copy(toolPos(t, ASP));

    const u = ss(16.4, 40, t);
    const zoom = ss(31, 33.5, t) * (1 - ss(37.6, 39.4, t));
    camera.position.set(lerp(2.7, 1.5, u) - 0.5 * zoom, lerp(1.45, 1.1, u) - 0.25 * zoom, lerp(3.7, 3.4, u) - 0.7 * zoom);
    camera.lookAt(lerp(0, 0.1, u), -0.12 - 0.05 * zoom, 0.35);
    const lop = Math.min(ss(17.4, 18.2, t), 1 - ss(39.2, 39.7, t)) * (1 - 0.85 * ss(31, 32, t) * (1 - ss(37.8, 38.6, t)));
    placeLabel(LBL[0], new THREE.Vector3(-1.1, top(-1.1) + 0.035, ZF), lop);
    placeLabel(LBL[1], new THREE.Vector3(-1.1, muscleTop(-1.1) + 0.5 * fatT(-1.1, t), ZF), lop);
    placeLabel(LBL[2], new THREE.Vector3(-1.1, -0.6, ZF), lop);
    placeLabel(LBL[3], new THREE.Vector3(0, top(0) + 0.075, ZF), ss(38.2, 38.8, t) * (1 - ss(39.2, 39.7, t)));
    LBL[3].style.transform = 'translate(-50%,-140%)';
  }
  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
